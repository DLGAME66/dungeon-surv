<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>运营数据 · 暗境生存</title>
<style>
  :root{--bg:#0f1020;--card:#1a1b35;--gold:#f5c542;--blue:#4a90e2;--green:#3ecf8e;--text:#e8e8f0;--muted:#9a9ab0}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);padding:20px;max-width:720px;margin:0 auto}
  h1{font-size:22px;margin-bottom:4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px}
  .stat{background:var(--card);border-radius:12px;padding:16px;text-align:center}
  .stat .num{font-size:28px;font-weight:800;color:var(--gold)}
  .stat .lbl{font-size:12px;color:var(--muted);margin-top:4px}
  .card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:16px}
  .card h2{font-size:15px;margin-bottom:12px;color:var(--blue)}
  .bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
  .bar .d{width:92px;color:var(--muted);flex-shrink:0}
  .bar .track{flex:1;background:#2a2b4a;border-radius:6px;height:14px;overflow:hidden;min-width:40px}
  .bar .fill{height:100%;background:var(--green)}
  .bar .v{width:36px;text-align:right;flex-shrink:0}
  button{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;cursor:pointer;margin-top:8px}
  .err{color:#ff6b6b;font-size:13px}
  a{color:var(--blue);text-decoration:none}
</style>
</head>
<body>
  <h1>📊 运营数据</h1>
  <div class="sub">DungeonSurv《暗境生存》· 实时统计面板</div>
  <div class="grid" id="kv"></div>
  <div class="card"><h2>📈 每日访问分布（PV）</h2><div id="daily"></div></div>
  <div class="card"><h2>⭐ 玩家反馈统计</h2><div id="feedback"></div></div>
  <div class="card"><h2>🐛 Bug 报告（最近 10 条）</h2><div id="bugs"></div></div>
  <button onclick="load()">🔄 刷新</button>
  <div class="sub" style="margin-top:12px"><a href="index.html">← 返回游戏</a></div>
  <div id="msg" class="err"></div>
<script>
const API='https://dungeon-surv-server-production.up.railway.app';
async function get(p){const r=await fetch(API+p);if(!r.ok)throw new Error(p+' HTTP '+r.status);return r.json();}
function stat(n,l){return '<div class="stat"><div class="num">'+n+'</div><div class="lbl">'+l+'</div></div>';}
function fmtDate(t){try{return new Date(t).toLocaleString('zh-CN');}catch(e){return String(t||'');}}
async function load(){
  document.getElementById('msg').textContent='加载中...';
  try{
    const [s,f,b]=await Promise.all([get('/api/stats'),get('/api/feedback/stats'),get('/api/bug_report/list')]);
    const bugs=Array.isArray(b)?b:[];
    document.getElementById('kv').innerHTML=
      stat(s.pageViews,'页面浏览 PV')+stat(s.uniqueVisitors,'独立访客 UV')+
      stat(f.total,'反馈总数')+stat((f.avgStar&&f.avgStar!=='N/A')?f.avgStar:'—','平均评分')+
      stat(bugs.length,'Bug 报告');
    const d=s.daily||{};const keys=Object.keys(d).sort();
    const max=Math.max(1,...Object.values(d));
    document.getElementById('daily').innerHTML=keys.length?keys.map(k=>
      '<div class="bar"><span class="d">'+k+'</span><span class="track"><span class="fill" style="width:'+(d[k]/max*100)+'%"></span></span><span class="v">'+d[k]+'</span></div>').join('')
      :'<div class="sub">暂无数据</div>';
    const total=f.total||0;
    let fb='<div class="sub">总反馈：'+total+' · 平均评分：'+(f.avgStar||'N/A')+'</div>';
    const bt=f.byType||{};const bk=Object.keys(bt);
    fb+=bk.length?bk.map(k=>'<div class="bar"><span class="d">'+k+'</span><span class="track"><span class="fill" style="width:'+(bt[k]/total*100)+'%"></span></span><span class="v">'+bt[k]+'</span></div>').join(''):'<div class="sub">暂无反馈</div>';
    document.getElementById('feedback').innerHTML=fb;
    document.getElementById('bugs').innerHTML=bugs.length?bugs.slice(0,10).map(x=>
      '<div class="bar"><span class="d">'+fmtDate(x.time||x.ts)+'</span><span class="v" style="width:auto;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(x.msg||x.message||'').slice(0,30)+'</span></div>').join('')
      :'<div class="sub">暂无 Bug 报告</div>';
    document.getElementById('msg').textContent='更新于 '+new Date().toLocaleString('zh-CN');
  }catch(e){document.getElementById('msg').textContent='加载失败：'+e.message+'（请确认服务器在线）';}
}
load();
</script>
</body>
</html>
